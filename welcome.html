<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silent Mod Welcome</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;1,300&display=swap');
        
        /* 
         * ম্যাজিক ফিক্স: 
         * overflow: hidden এবং touch-action: none দিয়ে 
         * WebView-এর স্ক্রল এবং বাউন্স এফেক্ট পুরোপুরি বন্ধ করা হয়েছে। 
         */
        html, body {
            margin: 0; 
            padding: 0;
            width: 100%; 
            height: 100%;
            overflow: hidden; 
            overscroll-behavior: none;
            touch-action: none; 
            background-color: transparent; 
            font-family: 'Roboto', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="flex justify-center items-center select-none">

    <!-- Main Dialog Box (10dp padding, 16dp radius) -->
    <!-- আগের gap-[16px] মুছে দেওয়া হয়েছে যাতে অকারণে লম্বা না হয় -->
    <div class="bg-[#0A0909] w-[90%] max-w-[340px] rounded-[16px] p-[10px] shadow-2xl flex flex-col">
        
        <!-- Top Section: Avatar & Title (8dp padding) -->
        <div class="flex items-center justify-center border border-[#DDDDDD] rounded-[16px] p-[8px]">
            <!-- Avatar (60dp size, 2dp border) -->
            <img id="avatarImg" 
                 src="https://silent.unaux.com/ME/avatar.jpg" 
                 onerror="this.onerror=null; this.src='avatar.jpg';" 
                 alt="avatar" 
                 class="w-[60px] h-[60px] rounded-full border-[2px] border-[#DDDDDD] object-cover ml-[6px]">
            
            <!-- Separator (3dp width) -->
            <div class="w-[2px] h-[45px] bg-[#DDDDDD] mx-[12px]"></div>
            
            <!-- Title Texts -->
            <div class="flex flex-col items-center mr-[6px]">
                <div class="border border-[#DDDDDD] rounded-[16px] px-[12px] py-[4px] bg-[#16000000]">
                    <span class="text-[#ffffff] font-medium text-[20px] tracking-wide leading-none">SILENT MOD</span>
                </div>
                <span class="text-[#ebebeb] text-[14px] mt-[4px] italic font-light">Modder,Web Developer</span>
            </div>
        </div>

        <!-- Middle Section: Message (8dp margin-top, 8dp padding) -->
        <div class="border border-[#DDDDDD] rounded-[16px] p-[8px] mt-[8px]">
            <p class="text-[#fefefe] text-[16px] font-light leading-snug m-0 text-center">
                Join our Telegram channel to access more modded apps and exclusive updates.
            </p>
        </div>

        <!-- Switch Area (16dp margin-top, 6dp padding, #34000000 bg) -->
        <label class="flex items-center cursor-pointer bg-[#34000000] p-[6px] px-[12px] rounded-[20px] mt-[16px] mx-[4px]">
            <div class="relative">
                <input type="checkbox" id="dontShowAgain" class="sr-only" onchange="toggleUI(this)">
                <!-- Track -->
                <div class="block bg-[#cccccc] w-[36px] h-[20px] rounded-full transition-colors duration-200" id="toggleBg"></div>
                <!-- Thumb -->
                <div class="dot absolute left-[2px] top-[2px] bg-[#eeeeee] w-[16px] h-[16px] rounded-full transition-transform duration-200" id="toggleDot"></div>
            </div>
            <div class="ml-[10px] text-[#dce4f0] text-[14px] font-light">
                Don't Show Again
            </div>
        </label>

        <!-- Bottom Section: Buttons (16dp margin-top, 8dp margin-bottom) -->
        <div class="flex justify-between items-center mt-[16px] mb-[8px] px-[16px]">
            <!-- Cancel Button -->
            <button onclick="handleAction('cancel')" class="text-[#ffffff] font-medium text-[16px] uppercase tracking-wider active:scale-95 transition-transform bg-transparent border-none outline-none">
                CANCEL
            </button>
            <!-- Join Button -->
            <button onclick="handleAction('join')" class="text-[#ffffff] font-medium text-[16px] uppercase tracking-wider active:scale-95 transition-transform bg-transparent border-none outline-none">
                JOIN
            </button>
        </div>

    </div>

    <script>
        // Visually update the switch when toggled
        function toggleUI(el) {
            const bg = document.getElementById('toggleBg');
            const dot = document.getElementById('toggleDot');
            
            if(el.checked) {
                bg.classList.replace('bg-[#cccccc]', 'bg-[#ffffff]');
                dot.classList.replace('bg-[#eeeeee]', 'bg-[#111111]');
                dot.classList.add('translate-x-[16px]');
            } else {
                bg.classList.replace('bg-[#ffffff]', 'bg-[#cccccc]');
                dot.classList.replace('bg-[#111111]', 'bg-[#eeeeee]');
                dot.classList.remove('translate-x-[16px]');
            }
        }

        // Handle button clicks and logic
        function handleAction(action) {
            const isChecked = document.getElementById('dontShowAgain').checked;
            
            if(isChecked && window.Android) {
                Android.disableWelcomeDialog();
            }

            if (action === 'cancel') {
                if(window.Android) Android.closeDialog();
            } else if (action === 'join') {
                if(window.Android) Android.openLink('https://t.me/SILENT_MOD_SG');
                setTimeout(() => {
                    if(window.Android) Android.closeDialog();
                }, 500);
            }
        }
    </script>
</body>
</html>
