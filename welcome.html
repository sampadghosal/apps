<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silent Mod Welcome</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;1,300&display=swap');
        body {
            font-family: 'Roboto', sans-serif;
            background-color: transparent; 
        }
        /* Removing default tap highlights on mobile */
        * { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="m-0 p-0 flex justify-center items-center h-screen select-none">

    <!-- Main Dialog Box -->
    <div class="bg-[#0A0909] w-[90%] max-w-[340px] rounded-[16px] p-[10px] flex flex-col gap-[16px] shadow-[0_0_20px_rgba(0,0,0,0.8)]">
        
        <!-- Top Section -->
        <div class="flex items-center justify-center border border-[#DDDDDD] rounded-[16px] p-[10px]">
            <!-- Avatar (Border reduced to 2px for standard look) -->
            <img id="avatarImg" 
                 src="https://silent.unaux.com/ME/avatar.jpg" 
                 onerror="this.onerror=null; this.src='avatar.jpg';" 
                 alt="avatar" 
                 class="w-[60px] h-[60px] rounded-full border-[2px] border-[#DDDDDD] object-cover">
            
            <!-- Separator (Thinner line, proper margin) -->
            <div class="w-[1px] h-[45px] bg-[#DDDDDD] mx-[12px]"></div>
            
            <!-- Title Texts -->
            <div class="flex flex-col items-center">
                <div class="border border-[#DDDDDD] rounded-[16px] px-[12px] py-[4px] bg-[#16000000]">
                    <span class="text-[#ffffff] font-medium text-[18px] tracking-wide leading-none">SILENT MOD</span>
                </div>
                <span class="text-[#ebebeb] text-[13px] mt-[4px] italic font-light">Modder,Web Developer</span>
            </div>
        </div>

        <!-- Middle Section -->
        <div class="border border-[#DDDDDD] rounded-[16px] p-[14px] text-center">
            <p class="text-[#fefefe] text-[15px] font-light leading-relaxed m-0">
                Join our Telegram channel to access more modded apps and exclusive updates.
            </p>
        </div>

        <!-- Switch Area -->
        <label class="flex items-center cursor-pointer bg-[#34000000] py-[8px] px-[12px] rounded-full mx-[4px]">
            <div class="relative">
                <input type="checkbox" id="dontShowAgain" class="sr-only" onchange="toggleUI(this)">
                <!-- Track -->
                <div class="block bg-[#cccccc] w-[40px] h-[22px] rounded-full transition-colors duration-300" id="toggleBg"></div>
                <!-- Thumb -->
                <div class="dot absolute left-[2px] top-[2px] bg-white w-[18px] h-[18px] rounded-full transition-transform duration-300" id="toggleDot"></div>
            </div>
            <div class="ml-[12px] text-[#dce4f0] text-[14px] font-light">
                Don't Show Again
            </div>
        </label>

        <!-- Bottom Section: Buttons (Text only, no bg boxes) -->
        <div class="flex justify-between items-center px-[20px] pb-[8px]">
            <!-- Cancel Button -->
            <button onclick="handleAction('cancel')" class="text-[#ffffff] font-medium text-[15px] uppercase tracking-wider active:opacity-70 transition-opacity bg-transparent border-none outline-none">
                CANCEL
            </button>
            <!-- Join Button -->
            <button onclick="handleAction('join')" class="text-[#ffffff] font-medium text-[15px] uppercase tracking-wider active:opacity-70 transition-opacity bg-transparent border-none outline-none">
                JOIN
            </button>
        </div>

    </div>

    <script>
        // Visually update the switch when toggled
        function toggleUI(el) {
            const bg = document.getElementById('toggleBg');
            const dot = document.getElementById('toggleDot');
            
            if(el.checked) {
                bg.classList.replace('bg-[#cccccc]', 'bg-[#ffffff]');
                dot.classList.replace('bg-white', 'bg-[#0A0909]');
                dot.classList.add('translate-x-[18px]');
            } else {
                bg.classList.replace('bg-[#ffffff]', 'bg-[#cccccc]');
                dot.classList.replace('bg-[#0A0909]', 'bg-white');
                dot.classList.remove('translate-x-[18px]');
            }
        }

        // Handle button clicks and logic
        function handleAction(action) {
            // Check if "Don't Show Again" is ticked when button is clicked
            const isChecked = document.getElementById('dontShowAgain').checked;
            
            if(isChecked && window.Android) {
                Android.disableWelcomeDialog();
            }

            if (action === 'cancel') {
                if(window.Android) Android.closeDialog();
            } else if (action === 'join') {
                if(window.Android) Android.openLink('https://t.me/SILENT_MOD_SG');
                // Close dialog after clicking join
                setTimeout(() => {
                    if(window.Android) Android.closeDialog();
                }, 500);
            }
        }
    </script>
</body>
</html>
